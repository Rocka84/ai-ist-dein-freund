<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background disk for high contrast on light/dark browser tabs -->
  <circle cx="50" cy="50" r="48" fill="#0a0d14"/>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="41" stroke="url(#orbGradient)" stroke-width="6.5"/>
  
  <!-- Left Eye: Wink Arc -->
  <path d="M 31 46 Q 38.5 36 46 46" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Right Eye: Open Eye with Highlight -->
  <path d="M 54 49 C 54 39, 68 39, 68 49 C 68 51, 54 51, 54 49 Z" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="63" cy="43.5" r="3" fill="#ffffff"/>
  
  <!-- Smile -->
  <path d="M 43 62 Q 50 69 57 62" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="round" fill="none"/>
</svg>
